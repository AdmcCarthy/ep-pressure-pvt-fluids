# PVT fluid classification from drill stem tests.
# Everything here is configuration so it can be edited and re-run.  Values marked ASSUMPTION are screening choices from the open literature
# (McCain, Glaso / Standing, Wilhelms/Larter), NOT calibrated to a PVT report of a field: they classify tests, they do not replace a PVT study.
# GOR and GLR are in Sm3/Sm3 (1 Sm3/Sm3 = 5.6146 scf/stb).  Pressure in bar, temperature in degC.

api:
  water_density_g_cm3: 0.999               # SG = density / this;  API = 141.5 / SG - 131.5   (DST oil density is read as a stock-tank density)
  classes:                                 # upper bound, first match.  Heavy / medium / light follow the usual 10 / 22.3 / 31.1 API limits
    - {name: extra-heavy, below: 10.0}
    - {name: heavy,       below: 22.3}
    - {name: medium,      below: 31.1}
    - {name: light,       below: 45.0}
    - {name: condensate-like, below: 1000.0}   # ASSUMPTION: a stock-tank liquid above about 45 API is condensate-like
  plausible: [5.0, 80.0]                   # outside: kept, flagged, not classified

# Fluid class from the initial producing GOR (McCain's rules of thumb, in scf/stb: black oil < 1750, volatile oil 1750-3200, retrograde gas condensate
# 3200-15000, wet gas 15000-100000, dry gas > 100000).  The classes overlap in nature (the stock-tank API is a second cue); here GOR decides.
fluid_class_by_gor_sm3_sm3:
  - {name: black oil,            below: 312.0}      # 1750 scf/stb
  - {name: volatile oil,         below: 570.0}      # 3200 scf/stb
  - {name: gas condensate,       below: 2672.0}     # 15000 scf/stb
  - {name: wet gas,              below: 17811.0}    # 100000 scf/stb
  - {name: dry gas,              below: 1000000000000.0}
liquid_below_gor_sm3_sm3: 570.0            # a test with GOR below this is treated as a liquid-phase (oil) system for the saturation state, above it as a gas system

# Reference fluid: the fluid of the plotted U, and the one used when a test has no oil density / temperature / gas density (`envelope_basis = reference`, then only
# indicative).  Set by the maintainer on 2026-11-03 to 40 API, 55 degC and gas gravity 1.00.  Against the reference GLR-pressure chart (see `calibration` below) the bubble-point
# branch is 11-16 % low in pressure over the mid-range of the left branch (GLR 110-316) and 17 % high at the critical end with Glaso (the default; the U closes at 415 bar,
# chart: 387 bar); with Standing it was 27-31 % low in the mid-range and closed the U at 378 bar.  The earlier fit (44 API, 90 degC, 0.91, Standing) was about 20-24 % low
# there and closed the U at 416 bar.  Neither correlation follows the chart's flattening towards the critical point exactly.
reference:
  api: 40.0
  temperature_c: 55.0
  gas_gravity: 1.00                        # gas relative density (air = 1)

# ---- GLR - pressure space (log GLR on the x axis from 10 to 1,000,000, pressure increasing downwards, scale on top) -----------------------------
# The saturation-pressure envelope is a U in this space (pressure down): the LEFT branch is the bubble point (the maximum solution GOR of a liquid at that
# pressure, Glaso or Standing), the RIGHT branch the dew point (the minimum GLR of a gas at that pressure, configured below); they meet inside the critical band.
# Zones, each drawn in one flat colour:
#   FORBIDDEN DOMAIN   above the U (pressure below the saturation pressure of that GLR): no single-phase reservoir fluid exists there.  Example: 200 bar
#                      and GLR 500 Sm3/Sm3 is far above what an oil dissolves and far below what a gas carries.  A test there is a mixture (gas cap + oil
#                      leg, coning, commingled intervals, two-phase inflow) or its pressure / rate is wrong.  Flagged, never corrected.
#   DIPHASIC DOMAIN    a band just beneath the forbidden domain along both branches: the fluid is AT its saturation pressure (within the uncertainty of the
#                      estimate), so it is in equilibrium with a second phase where one exists: OIL WITH GAS CAP (left), GAS WITH OIL RING (right).
#                      A saturated reading is evidence for a cap or ring, not proof (a fully undersaturated column can still have gas on top).
#   MONOPHASIC DOMAIN  beneath the diphasic bands: undersaturated oil (left), undersaturated gas (right) and the CRITICAL FLUID band (vertical).
# The U closes at the critical pressure: the higher of the pressures where the left and right branch reach the critical band.
critical_band:                             # vertical band of critical / near-critical fluid (volatile oil to rich condensate): GLR [Sm3/Sm3]
  glr_sm3_sm3: [500.0, 1200.0]             # ASSUMPTION: the 500 and 1,200 Sm3/Sm3 lines of the reference chart (about 2,800 and 6,700 scf/stb).  Textbooks put volatile /
  #                                          near-critical oil at about 2,000-3,300 scf/stb (360-590 Sm3/Sm3) and condensate above that; the exact band depends on
  #                                          composition and temperature, so it is configured, not a law.
  note: "near-critical fluids show a very small difference between bubble and dew point, so liquid yield changes abruptly with pressure"
gas_envelope:                              # CALIBRATED: minimum GLR [Sm3/Sm3] of a single-phase gas at pressure [bar]; interpolated in log GLR.
  # right branch of the reference chart, digitised by eye from a photograph (so about +-10 % in GLR and +-10 bar): pressure up to the minimum of the U (387 bar, GLR 570)
  pressure_bar:   [0, 13, 38, 83, 135, 180, 229, 281, 330, 354, 375, 387]
  min_glr:        [296000.0, 153000.0, 79000.0, 41000.0, 21000.0, 11000.0, 5700.0, 2960.0, 1530.0, 1100.0, 790.0, 570.0]   # held at 570 above 387 bar
# The digitised points of the reference chart (GLR [Sm3/Sm3], pressure [bar]); kept so the calibration can be checked (tests/test_pvt.py) and redone when a better
# copy of the chart or PVT data arrives.  Axis calibration from the chart's own ticks: GLR = 10^(2 + (x - 485) / 350), P = (y - 224) / 0.822 on the 2016 x 1512 photo.
calibration:
  chart_left_branch:  [[57, 62], [110, 147], [187, 229], [243, 299], [316, 354], [439, 382], [572, 387]]
  chart_right_branch: [[794, 375], [1104, 354], [1534, 330], [2961, 281], [5717, 229], [11037, 180], [21309, 135], [41142, 83], [79433, 38], [153361, 13]]
  minimum_of_u:       {glr_sm3_sm3: 572, pressure_bar: 387}      # the critical point of the chart: inside the critical band
# Uncertainty of a test's producing GOR (= the GLR axis), a LITERATURE value (Moffatt & Williams 1998, SPE 49067, Table 4 p. 16: separator GOR typically +-5 %,
# estimated worst case +-25 %; operator / laboratory experience, not measurements on reference fluids).  Used to ask how big a GLR error would put a forbidden-domain
# test on the envelope (`forbidden_glr_factor`, `forbidden_resolution`); the envelope's own width (`saturation` below) is separate and is NOT added in.
# knowledge_entry = the entry in knowledge/pvt.yaml that holds the citation.
gor_uncertainty:
  typical: 0.05
  worst_case: 0.25
  knowledge_entry: mw98-gor-error-bounds
saturation:
  undersaturated_below: 0.80               # liquid: GLR / maximum solution GOR at that pressure below this = undersaturated oil, from this up to 1 = diphasic band (oil with gas cap)
  saturated_gas_below: 1.25                # gas: GLR / minimum GLR at that pressure from 1 up to this = diphasic band (gas with oil ring), above = undersaturated gas
  # The band widths are the uncertainty of the estimate: the bubble-point correlations are good to about +-7 % (Glaso, on its own North Sea data) to +-15-20 % (Standing) in GOR (0.80), the gas envelope is a rough screen (1.25).

# Manual PVT report values (sheet `pvt_report` of the data-gap workbook, docs/enrichment.md).  A report is matched to the DST of the same wellbore whose
# mid depth is closest to the sample MD and within this tolerance.  A STATED bubble point / dew point replaces the envelope estimate; stated API, gas
# gravity and temperature only fill what the DST lacks (official values win); a stated fluid type replaces the GOR class.
report:
  match_tolerance_m: 50.0                  # ASSUMPTION: DST intervals and sample depths are rarely identical; a larger gap is not matched (and is logged)
  stated_tolerance: 0.05                   # |P / Pb - 1| (or |P / Pdew - 1|) within this: the fluid is AT its saturation pressure (saturated); the gauge error band
  conflict_ratio: 0.10                     # a stated API / gas gravity / temperature that differs from the DST by more than this is logged (the DST value is kept)

# Standing (1947) solution GOR (the alternative left branch, `left_branch` above):  Rs[scf/stb] = gg * ((p[psia] / 18.2 + 1.4) * 10^(0.0125 API - 0.00091 T[degF]))^1.2048   (built for Californian crudes, used worldwide as a screen)
standing:
  p_divisor: 18.2
  p_offset: 1.4
  exponent: 1.2048
  api_coeff: 0.0125
  temp_coeff: 0.00091

# The bubble-point (left) branch of the envelope: `glaso` (North Sea oils, below: the DEFAULT, the maintainer 2026-11-03) or `standing` (Californian oils, the earlier default).  Changing it changes the
# envelope, so the zones, the states and the forbidden counts of well_dst_pvt, the dashboards and the analysis notebooks all follow (rebuild with scripts/build_all.py).  Against the
# digitised reference chart (40 API, 55 degC, gg 1.00) Glaso is closer (mean |deviation| 11.6 % against 19.4 % for Standing; docs/pvt.md section 8).
left_branch:
  correlation: glaso                       # the maintainer, 2026-11-03: Glaso is the default (North Sea oils); `standing` remains available

# Glaso (1980) "Generalized Pressure-Volume-Temperature Correlations", JPT 32 (5) 785-795 (SPE 8016-PA), Eq. 6: North Sea oils (wells from 56 N to the early 60s N), flash-separator GOR, total surface-gas
# gravity; valid 150 to 7,000 psig, standard deviation 6.98 % (3.84 % for 2,000 to 7,000 psig; Table 11).  Pb* = (R / gg)^0.816 T^0.172 / API^0.989 (R scf/STB, T degF),
# log10 Pb[psia] = a + b log10 Pb* - c (log10 Pb*)^2.  Reproduces Table 9 of the paper to 0.2-0.4 % (tests/test_pvt.py).  NOT applied: the CO2 / N2 / H2S corrections (Eqs. 17-19,
# no composition) and the volatile-oil temperature exponent 0.130 (Eq. 20; a volatile oil cannot be told from the data).  knowledge_entry: knowledge/pvt.yaml.
glaso:
  a: 1.7669
  b: 1.7447
  c: 0.30218
  gor_exponent: 0.816
  temp_exponent: 0.172
  api_exponent: 0.989
  knowledge_entry: gl80-saturation-pressure-correlation

# ---- Biodegradation and pasteurisation ------------------------------------------------------------------------------------------------------
# Microbial degradation of oil needs reservoir temperature below about 60-80 degC (Wilhelms et al., Nature 2001: reservoirs heated above ca 80-90 degC
# during deep burial were "pasteurised" and stay sterile even after uplift and cooling; Larter et al. 2003/2006).  The decisive temperature is the
# MAXIMUM PAST temperature, which this data does not have: the present-day test temperature is a minimum of it (equal in a never-uplifted basin).
biodegradation:
  temperature_brackets_c:
    - {name: degradable,   below: 60.0}
    - {name: transition,   below: 80.0}
    - {name: pasteurised,  below: 1000.0}
  heavy_api_below: 25.0                    # ASSUMPTION: as in the analysis notebooks; clearly degraded oils are < 20 API, mixed by charge and maturity up to ~25
  light_api_above: 30.0
  uplift_areas: [BARENTS SEA]              # same areas as pressure.yaml `underpressure.areas`: uplift and erosion, so the maximum past temperature was higher than today
