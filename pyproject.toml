[project]
name = "ep-pressure-pvt-fluids"
version = "1.0.0"
description = "Pressure, PVT and fluids: pore pressure and regimes, the drilling window, buoyancy, compaction, PVT, equations of state, column grading, fluid gradients, measurement types, geochemistry screening, and their figures and dashboards"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "AdmcCarthy", email = "24669992+AdmcCarthy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "ep-physics-base",
]

[project.optional-dependencies]
plots = ["matplotlib", "geopandas", "shapely"]

[tool.uv.sources]
ep-physics-base = { git = "https://github.com/AdmcCarthy/ep-physics-base" }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib",
    "shapely",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
